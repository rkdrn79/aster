[package]
name = "orca-cli-launcher"
version = "0.0.0"
edition = "2021"
publish = false

# Why a neutral bin name: build-windows-cli-launcher.mjs copies it to the product's
# `<cliName>.exe` and stamps that name as the PE's OriginalFilename.
[[bin]]
name = "cli-launcher"
path = "src/main.rs"

[[bin]]
name = "orca-administrator-restart"
path = "src/administrator_launcher.rs"

[build-dependencies]
winresource = "0.1"

# Why: this is a launcher, not a program. Everything here trims the PE toward the
# shape of an ordinary small native utility -- no panic machinery, no debug
# sections, one codegen unit -- which is also what keeps it out of the
# heuristic bucket the previous managed build sat in.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
